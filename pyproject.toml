[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cdhist"
description = "Program to provide a Linux cd history directory stack"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
keywords = ["bash", "zsh", "cd", "fzf"]
dynamic = ["version"]

[[project.authors]]
name = "Mark Blakeney"
email = "mark.blakeney@bullet-systems.net"

[project.urls]
Homepage = "https://github.com/bulletmark/cdhist"

[project.scripts]
cdhist = "cdhist:main"

[tool.setuptools_scm]
version_scheme = "post-release"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["SIM115", "SIM905", "BLE001", "PLW1510", "S110", "DTZ"]

